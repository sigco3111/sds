    <style>
      @font-face {
        font-family: 'Piazzolla';
        src: url('/fonts/piazzolla-ui.woff2') format('woff2-variations'),
             url('/fonts/piazzolla-ui.woff2') format('woff2');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
      }
      /* 한국어판 인터페이스 서체: Noto Serif KR (SIL OFL 1.1).
         한글 글리프가 실제로 필요할 때만 내려받는다. */
      @font-face {
        font-family: 'Noto Serif KR';
        src: url('/fonts/noto-serif-kr.woff2') format('woff2');
        font-weight: 400 700;
        font-style: normal;
        font-display: swap;
        unicode-range: U+1100-11FF, U+3130-318F, U+AC00-D7A3;
      }
      @font-face {
        font-family: 'Piazzolla Display Fallback';
        src: local('Georgia');
        size-adjust: 96.68%;
        ascent-override: 114.82%;
        descent-override: 32.07%;
        line-gap-override: 0%;
      }
      :root {
        --herd-font: 'Piazzolla', 'Noto Serif KR', Georgia, 'Times New Roman', serif;
        --herd-display-font: 'Piazzolla', 'Noto Serif KR', 'Piazzolla Display Fallback', Georgia, 'Times New Roman', serif;
        --herd-word-space: .065em;
      }
      html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #eadfca; }
      canvas { display: block; touch-action: none; }
      .static-shell { box-sizing: border-box; width: 100%; height: 100%; display: grid; place-items: center; padding: 24px; color: #2c3828; font: 14px/1.5 system-ui, sans-serif; text-align: center; }
      .static-shell__card { width: min(88vw, 440px); box-sizing: border-box; padding: 32px; border: 1px solid rgba(78,65,46,.2); border-radius: 32px; background: rgba(244,234,215,.72); box-shadow: 0 18px 70px rgba(65,51,34,.12); }
      .static-shell h1 { margin: 0 0 10px; font: 400 48px/1 var(--herd-display-font); letter-spacing: .035em; word-spacing: var(--herd-word-space); }
      @media (prefers-reduced-data: reduce) {
        :root {
          --herd-font: 'Noto Serif KR', Georgia, 'Times New Roman', serif;
          --herd-display-font: 'Noto Serif KR', Georgia, 'Times New Roman', serif;
          --herd-word-space: normal;
        }
      }
      .static-shell p { margin: 0; color: #596052; letter-spacing: .12em; }
      .static-shell .static-shell__description { margin: 16px 0; letter-spacing: normal; }
      .static-shell nav { display: flex; justify-content: center; gap: 20px; }
      .static-shell a { color: #365f44; text-underline-offset: 3px; }
    </style>
  </head>

    <div id="root">

          <p class="static-shell__description">브라우저에서 즐기는 무료 양몰이 게임. 양몰이 개가 되어 이동, 전력질주, 짖기로 25, 75, 200마리의 양을 울타리 안으로 몰아 넣으세요.</p>
          <noscript><p class="static-shell__description">플레이하려면 JavaScript를 켜 주세요. 아래 게임 정보와 조작법은 JavaScript 없이 볼 수 있습니다.</p></noscript>

        </section>
      </main>
    </div>
